<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家庭記帳本</title>
<!-- 手機 App（PWA）設定：需放在 https 網址上才能安裝 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6fde">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家庭記帳">
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#6b7385;--line:#e4e7ec;
  --accent:#2f6fde;--accent-soft:#e8f0fd;--good:#1f9d63;--warn:#d98a00;--bad:#d64545;
  --inc:#1f9d63;--exp:#d64545;--shadow:0 1px 3px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151b;--card:#1b1f27;--text:#e7eaf0;--muted:#97a0b2;--line:#2b313c;
    --accent:#6a9cf5;--accent-soft:#1f2b42;--good:#3cc785;--warn:#f0a92a;--bad:#f06a6a;
    --inc:#3cc785;--exp:#f06a6a;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#12151b;--card:#1b1f27;--text:#e7eaf0;--muted:#97a0b2;--line:#2b313c;
  --accent:#6a9cf5;--accent-soft:#1f2b42;--good:#3cc785;--warn:#f0a92a;--bad:#f06a6a;
  --inc:#3cc785;--exp:#f06a6a;--shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Microsoft JhengHei","PingFang TC",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{max-width:1100px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;flex:1}
nav{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--accent);border-color:var(--accent);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:15px}
.kpi .lbl{color:var(--muted);font-size:13px}
.kpi .val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
button.btn,label.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.ghost,label.ghost{background:var(--accent-soft);color:var(--accent)}
button.danger{background:none;color:var(--bad);border:1px solid var(--bad)}
button.mini{padding:3px 8px;font-size:13px;border-radius:6px}
select,input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:13px}
td.n,th.n{text-align:right}
.pos{color:var(--inc)}.neg{color:var(--exp)}.muted{color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.advice{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.advice li{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border-left:4px solid var(--muted)}
.advice li.good{border-color:var(--good)}.advice li.warn{border-color:var(--warn)}.advice li.bad{border-color:var(--bad)}
.advice b{display:block}
.legend{display:grid;gap:4px;font-size:13px}
.legend span.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.empty{color:var(--muted);text-align:center;padding:24px}
dialog{border:0;border-radius:14px;padding:0;background:var(--card);color:var(--text);width:min(460px,calc(100vw - 32px));box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{padding:18px;display:grid;gap:10px}
dialog h3{margin:0 0 4px}
dialog label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
dialog label.f input,dialog label.f select{width:100%}
.flex2{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
svg text{fill:var(--muted);font-size:11px}
#imp,#ext,#stm{width:min(1040px,calc(100vw - 32px))}
#imp .imp,#ext .imp,#stm .imp{padding:18px;display:grid;gap:12px}
#ext td,#ext th,#stm td,#stm th{font-size:13px;padding:6px 8px}
#stm td input,#stm td select{padding:4px 6px;font-size:13px}
#stm textarea{width:100%;min-height:80px;font:13px/1.4 ui-monospace,Consolas,monospace;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.mapgrid label{display:grid;gap:3px;font-size:13px;color:var(--muted)}
.mapgrid select{width:100%;font-size:13px;padding:5px 8px}
#imp textarea{width:100%;min-height:90px;font:13px/1.4 ui-monospace,Consolas,monospace;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
#imp td input,#imp td select{padding:4px 6px;font-size:13px}
#imp tr.off td{opacity:.45}
/* 手機版 */
header{padding-top:env(safe-area-inset-top)}
main{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
#installBtn{display:none}
#updBar,#undoBar{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;max-width:560px;margin:0 auto;
  background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.18);align-items:center;gap:10px}
#updBar.show,#undoBar.show{display:flex}
.btn.mv{padding:3px 8px;min-width:30px}.btn.mv:disabled{opacity:.3;cursor:default}
#undoBar{z-index:21}
@media (max-width:600px){
  .top{padding:10px 12px 0;gap:8px}
  .top h1{font-size:16px}
  nav{padding:0 8px}nav button{padding:10px 9px}
  main{padding:12px}
  .grid{gap:10px}
  .g4{grid-template-columns:1fr 1fr}
  .card{padding:12px;border-radius:10px}
  .kpi .val{font-size:18px}
  .kpi .sub{font-size:11px}
  th,td{padding:7px 8px}
  select,input,textarea{font-size:16px}   /* 避免 iPhone 點輸入框時自動放大 */
  .flex2 svg{width:130px;height:130px}
  dialog form,#imp .imp,#ext .imp,#stm .imp{padding:14px}
  .drop{padding:14px}
}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
</style>

<body>
<header>
  <div class="top">
    <h1>🏠 家庭記帳本</h1>
    <button id="installBtn" class="btn ghost" onclick="installApp()">📲 安裝</button>
    <button id="undoBtn" class="btn ghost" onclick="undoLast()" hidden>↩ 復原</button>
    <select id="monthSel" title="分析月份"></select>
    <button class="btn" onclick="openForm('txns')">＋ 記一筆</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div id="updBar" role="status"></div>
<div id="undoBar" role="status"></div>
<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<dialog id="imp"><div class="imp" id="impBody"></div></dialog>
<dialog id="ext"><div class="imp" id="extBody"></div></dialog>
<dialog id="stm"><div class="imp" id="stmBody"></div></dialog>

<script>
const KEY='familyLedger.v1';
const EXP_CATS=['餐飲','日用品','交通','居住','水電瓦斯','通訊網路','教育','育兒','醫療','保險','娛樂','服飾','旅遊','孝親','稅費','貸款','其他'];
const INC_CATS=['薪資','獎金','股利','利息','投資收益','兼職','其他收入'];
const PALETTE=['#2f6fde','#e8743b','#19a979','#ed4a7b','#945ecf','#13a4b4','#d6b100','#6c8893','#ee6868','#2f9e44','#8f5b3c','#4c6ef5'];
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<0?'-':'')+'NT$'+Math.round(Math.abs(n)).toLocaleString('zh-TW');
const pct=n=>isFinite(n)?(n*100).toFixed(1)+'%':'—';
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const ymOf=d=>String(d||'').slice(0,7);
function shiftYm(ym,k){let[y,m]=ym.split('-').map(Number);m+=k;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+String(m).padStart(2,'0')}

/* ---------- 版本與資料遷移 ----------
   APP_VERSION：程式版本（顯示用）。
   SCHEMA_VERSION：資料結構版本。日後若資料欄位有變動：
   1) SCHEMA_VERSION + 1
   2) 在 MIGRATIONS 加一個對應的函式，把舊資料轉成新格式
   舊備份檔匯入、或瀏覽器內的舊資料，都會自動依序升級，不會遺失。
   （儲存鍵 KEY 請勿更改，否則會讀不到既有資料）*/
const APP_VERSION='1.7.0';   // 改版時同步修改 sw.js 的 VERSION，手機才會更新快取
const SCHEMA_VERSION=2;
const CHANGELOG=[
  ['1.7.0','對帳單／帳單可上傳截圖或照片（可多張），在裝置上辨識文字後匯入；帳戶、股票、貸款、信用卡、保險等清單可上下移動調整順序；總覽新增「各成員財產」比較與個別成員明細'],
  ['1.6.4','收支明細依成員篩選時，列出動到該成員所有帳戶／信用卡的紀錄（含被轉入的一方），並標示轉入／轉出與合計'],
  ['1.6.3','↩ 復原：匯入對帳單／帳單／備份或清除資料前自動保留還原點（最多 5 個），匯入後下方出現「復原」、標題列常駐復原鈕，設定頁可選擇復原到哪一步'],
  ['1.6.2','證券月對帳單匯入（富邦等）：讀取交割資料（依交割日記交割款）與現股買賣明細（定期定額、整張／零股），自動補股票代號並記住、與對帳單合計核對'],
  ['1.6.1','自動更新：開啟 App 時檢查新版本並在畫面下方提示「立即更新」、設定頁可手動檢查更新；下載檔版本會提示改用網址'],
  ['1.6.0','對帳單自行校正：自動判斷失敗時改用手動欄位對應（可從右邊數欄位）、指定金額方向、逐筆修改日期金額、儲存各家格式並自動套用；信用卡帳單也支援'],
  ['1.5.1','銀行對帳單支援合庫等「電子綜合對帳單」：金額與手續費分行列出的轉帳明細、以帳戶總覽餘額校正'],
  ['1.5.0','可安裝成手機 App（PWA）：主畫面圖示、全螢幕開啟、離線可用；手機版面調整'],
  ['1.4.0','新增銀行對帳單匯入（依餘額判斷收支、自動辨識繳卡費／提款／證券交割、餘額校正）、證券庫存與交易明細匯入'],
  ['1.3.0','新增從其他記帳 App（CWMoney、AndroMoney 等）匯入 CSV／Excel，可自動辨識欄位與編碼'],
  ['1.2.0','新增帳戶間轉帳與繳卡費、外幣帳戶／交易／股票與匯率表、備份檔含版本資訊與匯入前自動保留還原點'],
  ['1.1.0','新增信用卡帳單匯入（PDF／CSV／貼上文字）、房產與其他資產'],
  ['1.0.0','初版：收支、帳戶、股票、貸款、信用卡、保險、財務分析與建議'],
];
const MIGRATIONS={
  // v1 → v2：補上外幣、轉帳相關欄位
  1:s=>{
    s.assets=s.assets||[];s.fx=s.fx||{};s.meta=s.meta||{};
    s.accounts.forEach(a=>{a.currency=a.currency||'TWD'});
    s.stocks.forEach(x=>{x.currency=x.currency||'TWD'});
    s.txns.forEach(t=>{t.currency=t.currency||'TWD';if(t.cardId===undefined)t.cardId=''});
  },
};
function migrate(s){
  let v=+s.version||1;   // 沒有 version 欄位的是 v1 舊資料（要在合併預設值之前讀）
  s=Object.assign(defaultState(),s);
  if(v>SCHEMA_VERSION)throw new Error(`這份資料來自較新的版本（資料版本 ${v}），請先更新 App 再匯入。`);
  while(v<SCHEMA_VERSION){if(MIGRATIONS[v])MIGRATIONS[v](s);v++}
  s.version=SCHEMA_VERSION;return s;
}
function defaultState(){return{
  version:SCHEMA_VERSION,
  members:[{id:'m1',name:'我',role:'本人'},{id:'m2',name:'太太',role:'配偶'},{id:'m3',name:'小孩',role:'子女'}],
  accounts:[],assets:[],txns:[],stocks:[],loans:[],cards:[],insurance:[],budgets:{},
  fx:{USD:32,JPY:0.21,EUR:35,CNY:4.4,HKD:4.1,AUD:21,GBP:41},meta:{}}}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&s.members)return migrate(s)}}catch(e){console.error(e);alert('讀取資料時發生問題：'+e.message)}return defaultState()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('無法儲存到瀏覽器，請記得匯出備份')}}
let S=load();
let tab='overview';
let curYm=ymOf(todayStr());
let txFilter={member:'',type:''};

const memberName=id=>S.members.find(m=>m.id===id)?.name||'家庭共同';
const memberOpts=(allowAll=true)=>[...(allowAll?[['','家庭共同']]:[]),...S.members.map(m=>[m.id,m.name])];
const accountOpts=()=>[['','（不指定）'],...S.accounts.map(a=>[a.id,a.name+'・'+memberName(a.memberId)]),['stock','📈 股票投資（賣股入帳：轉帳的轉出方）']];
// 'stock' 是虛擬的「股票投資」對象：買股＝帳戶轉出到 stock，賣股＝stock 轉入帳戶（不算收支，持股市值另計）

/* ---------- 外幣 ---------- */
const CURRENCIES=['TWD','USD','JPY','EUR','CNY','HKD','AUD','GBP','SGD','KRW','CAD','CHF','NZD','THB'];
const curOpts=()=>CURRENCIES.map(c=>[c,c]);
const rate=c=>!c||c==='TWD'?1:(+S.fx[c]||0);                       // 1 外幣 = ? 台幣
const fmtCur=(n,c)=>!c||c==='TWD'?money(n):`${c} ${(+n).toLocaleString('zh-TW',{maximumFractionDigits:2})}`;
const txRate=t=>!t.currency||t.currency==='TWD'?1:(+t.rate||rate(t.currency));
const twd=t=>(+t.amount||0)*txRate(t);                              // 交易金額換算台幣
const acctCur=id=>S.accounts.find(a=>a.id===id)?.currency||'TWD';
const conv=(v,from,to)=>{const r=rate(to);return r?v*rate(from)/r:0};
// 轉帳轉入金額（未填時依匯率換算）
const toAmt=t=>t.toAmount!==''&&t.toAmount!=null?+t.toAmount:conv(+t.amount||0,acctCur(t.accountId),acctCur(t.toAccountId));

/* ---------- 計算 ---------- */
function accountBalance(a,upto){  // 以帳戶本身幣別計；upto＝只算到某日（含）
  const cur=a.currency||'TWD';let b=+a.opening||0;
  for(const t of S.txns){
    if(upto&&t.date>upto)continue;
    if(t.type==='transfer'){
      if(t.accountId===a.id)b-=(+t.amount||0)+(+t.fee||0);
      if(t.toAccountId===a.id)b+=toAmt(t);
    }else if(t.accountId===a.id){
      const v=(t.currency||'TWD')===cur?+t.amount:conv(twd(t),'TWD',cur);
      b+=t.type==='income'?v:-v;
    }
  }
  return b;
}
const accountTWD=a=>accountBalance(a)*rate(a.currency);
function loanCalc(l){
  const P=+l.principal||0,n=Math.round((+l.years||0)*12),r=(+l.rate||0)/100/12;
  const pmt=n?(r?P*r/(1-Math.pow(1+r,-n)):P/n):0;
  let k=0;if(l.start){const s=new Date(l.start),t=new Date();k=(t.getFullYear()-s.getFullYear())*12+(t.getMonth()-s.getMonth())+(t.getDate()>=s.getDate()?1:0)}
  k=Math.max(0,Math.min(n,k));
  const rem=r?P*Math.pow(1+r,k)-pmt*(Math.pow(1+r,k)-1)/r:P-pmt*k;
  return{pmt,n,k,rem:Math.max(0,rem),interestTotal:pmt*n-P};
}
const stockMV=s=>(+s.shares||0)*(+s.price||0)*rate(s.currency);     // 台幣
const stockCost=s=>(+s.shares||0)*(+s.cost||0)*rate(s.currency);
function monthTx(ym){return S.txns.filter(t=>ymOf(t.date)===ym)}
// 轉帳不是收入也不是支出；手續費算支出
function sumType(list,type){return list.reduce((s,t)=>s+(t.type===type?twd(t):(type==='expense'&&t.type==='transfer'?(+t.fee||0)*rate(acctCur(t.accountId)):0)),0)}
function avgMonthly(type,ym,n=3){
  let tot=0,c=0;for(let i=0;i<n;i++){const l=monthTx(shiftYm(ym,-i));if(l.length){tot+=sumType(l,type);c++}}return c?tot/c:0;
}
function cardDueInfo(c){
  const t=new Date();t.setHours(0,0,0,0);const day=+c.dueDay||1;
  let d=new Date(t.getFullYear(),t.getMonth(),day);if(d<t)d=new Date(t.getFullYear(),t.getMonth()+1,day);
  return{date:d,days:Math.round((d-t)/864e5)};
}
// m 不給＝全家；給成員 id＝只算該成員的（''＝家庭共同）
function totals(m){
  const own=x=>m===undefined||(x.memberId||'')===m;
  const A=S.accounts.filter(own),ST=S.stocks.filter(own),LN=S.loans.filter(own),CD=S.cards.filter(own),IN=S.insurance.filter(own),AS=S.assets.filter(own);
  const cash=A.reduce((s,a)=>s+accountTWD(a),0);
  const liquid=A.filter(a=>a.type!=='定存').reduce((s,a)=>s+accountTWD(a),0);
  const fxCash=A.filter(a=>(a.currency||'TWD')!=='TWD').reduce((s,a)=>s+accountTWD(a),0);
  const stock=ST.reduce((s,x)=>s+stockMV(x),0),stockCostT=ST.reduce((s,x)=>s+stockCost(x),0);
  const loan=LN.reduce((s,l)=>s+loanCalc(l).rem,0);
  const loanPmt=LN.reduce((s,l)=>{const c=loanCalc(l);return s+(c.k<c.n?c.pmt:0)},0);
  const card=CD.filter(c=>!c.paid).reduce((s,c)=>s+(+c.bill||0),0);
  const premium=IN.reduce((s,i)=>s+(+i.premium||0),0),coverage=IN.reduce((s,i)=>s+(+i.coverage||0),0);
  const other=AS.reduce((s,a)=>s+(+a.value||0),0);
  return{cash,liquid,fxCash,stock,stockCost:stockCostT,other,loan,loanPmt,card,premium,coverage,assets:cash+stock+other,liab:loan+card,net:cash+stock+other-loan-card,
    lists:{A,ST,LN,CD,IN,AS}};
}

/* ---------- 表單 ---------- */
const dlg=document.getElementById('dlg'),form=document.getElementById('dlgForm');
function openForm(ent,id){
  const cfg=ENT[ent];const rec=id?S[ent].find(x=>x.id===id):{...(cfg.defaults?cfg.defaults():{})};
  const f=cfg.fields.map(fd=>{
    const v=rec[fd.k]??'';const lb=`<span data-lbl>${fd.l}</span>`;
    if(fd.t==='select')return`<label class="f" data-k="${fd.k}">${lb}<select name="${fd.k}">${fd.opts().map(([ov,ol])=>`<option value="${esc(ov)}" ${String(ov)===String(v)?'selected':''}>${esc(ol)}</option>`).join('')}</select></label>`;
    if(fd.t==='checkbox')return`<label class="row" data-k="${fd.k}"><input type="checkbox" name="${fd.k}" ${v?'checked':''}> ${lb}</label>`;
    return`<label class="f" data-k="${fd.k}">${lb}<input name="${fd.k}" type="${fd.t}" ${fd.t==='number'?'step="any"':''} ${fd.list?`list="${fd.list}"`:''} value="${esc(v)}" ${fd.req?'required':''}></label>`;
  }).join('');
  form.innerHTML=`<h3>${id?'編輯':'新增'}${cfg.title}</h3>${f}
    <datalist id="catList">${[...EXP_CATS,...INC_CATS].map(c=>`<option value="${c}">`).join('')}</datalist>
    <div class="row" style="margin-top:6px">${id?`<button type="button" class="danger btn" onclick="delRec('${ent}','${id}')">刪除</button>`:''}<span class="sp"></span>
    <button type="button" class="btn ghost" onclick="dlg.close()">取消</button><button class="btn" value="ok">儲存</button></div>`;
  // 依「類型」顯示／隱藏欄位（例：轉帳時才顯示轉入帳戶）
  const sync=()=>{
    const ty=form.elements.type?.value;
    for(const fd of cfg.fields){
      const box=form.querySelector(`[data-k="${fd.k}"]`);const show=!fd.when||fd.when.includes(ty);
      box.style.display=show?'':'none';
      const el=form.elements[fd.k];if(fd.req&&el.type!=='checkbox')el.required=show;
      if(fd.lt)box.querySelector('[data-lbl]').textContent=ty==='transfer'?fd.lt:fd.l;
    }
  };
  if(form.elements.type)form.elements.type.onchange=sync;sync();
  form.onsubmit=e=>{
    e.preventDefault();
    const out={};
    for(const fd of cfg.fields){const el=form.elements[fd.k];out[fd.k]=fd.t==='checkbox'?el.checked:fd.t==='number'?(el.value===''?'':+el.value):el.value.trim()}
    const err=cfg.validate&&cfg.validate(out);if(err)return alert(err);
    if(id)Object.assign(rec,out);else S[ent].push({id:uid(),...out});
    cfg.afterSave&&cfg.afterSave(out);
    if(ent==='txns'&&out.date)curYm=ymOf(out.date);
    save();dlg.close();render();
  };
  dlg.showModal();
}
function delRec(ent,id){
  if(ent==='members'&&S.members.length<=1)return alert('至少保留一位成員');
  if(!confirm('確定刪除？'))return;
  S[ent]=S[ent].filter(x=>x.id!==id);save();dlg.close();render();
}
function togglePaid(id){const c=S.cards.find(x=>x.id===id);c.paid=!c.paid;save();render()}

/* ---------- 共用元件 ---------- */
function table(ent,rows){
  const cfg=ENT[ent];
  if(!rows.length)return`<div class="empty">還沒有資料，按「新增」開始。</div>`;
  return`<div class="tbl"><table><thead><tr>${cfg.cols.map(c=>`<th class="${c[2]?'n':''}">${c[0]}</th>`).join('')}<th></th></tr></thead><tbody>
  ${rows.map((r,i)=>`<tr>${cfg.cols.map(c=>`<td class="${c[2]?'n':''}">${c[1](r)}</td>`).join('')}<td style="white-space:nowrap">${rows.length>1&&ent!=='txns'?
    `<button class="btn ghost mini mv" title="往上移" ${i?'':'disabled'} onclick="moveRec('${ent}','${r.id}',-1)">↑</button><button class="btn ghost mini mv" title="往下移" ${i<rows.length-1?'':'disabled'} onclick="moveRec('${ent}','${r.id}',1)">↓</button> `:''}<button class="btn ghost mini" onclick="openForm('${ent}','${r.id}')">編輯</button></td></tr>`).join('')}
  </tbody></table></div>`;
}
// 上下移動調整順序（帳戶、股票、貸款、信用卡、保險、資產、成員；下拉選單也會照這個順序）
function moveRec(ent,id,d){
  const L=S[ent],i=L.findIndex(x=>x.id===id),j=i+d;if(i<0||j<0||j>=L.length)return;
  [L[i],L[j]]=[L[j],L[i]];save();render();
}
function section(ent,summary=''){
  return`<div class="card"><div class="row" style="margin-bottom:12px"><h3 style="margin:0">${ENT[ent].title}</h3><span class="sp"></span><button class="btn" onclick="openForm('${ent}')">＋ 新增</button></div>${summary}${table(ent,S[ent])}</div>`;
}
const kpi=(l,v,sub='',cls='')=>`<div class="card kpi"><div class="lbl">${l}</div><div class="val ${cls}">${v}</div><div class="sub">${sub}</div></div>`;

function donut(items){
  const total=items.reduce((s,x)=>s+x.v,0);if(!total)return`<div class="empty">本月尚無支出</div>`;
  const r=60,C=2*Math.PI*r;let acc=0;
  const segs=items.map((x,i)=>{const len=x.v/total*C;const s=`<circle r="${r}" cx="80" cy="80" fill="none" stroke="${PALETTE[i%PALETTE.length]}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 80 80)"><title>${esc(x.k)} ${money(x.v)}</title></circle>`;acc+=len;return s}).join('');
  return`<div class="flex2"><svg viewBox="0 0 160 160" width="160" height="160">${segs}<text x="80" y="76" text-anchor="middle" style="font-size:11px">本月支出</text><text x="80" y="94" text-anchor="middle" style="font-size:13px;fill:var(--text);font-weight:700">${money(total)}</text></svg>
  <div class="legend">${items.map((x,i)=>`<div><span class="dot" style="background:${PALETTE[i%PALETTE.length]}"></span>${esc(x.k)}　<b>${money(x.v)}</b> <span class="muted">${pct(x.v/total)}</span></div>`).join('')}</div></div>`;
}
function trend(ym){
  const ms=[];for(let i=5;i>=0;i--)ms.push(shiftYm(ym,-i));
  const data=ms.map(m=>{const l=monthTx(m);return{m,inc:sumType(l,'income'),exp:sumType(l,'expense')}});
  const max=Math.max(1,...data.flatMap(d=>[d.inc,d.exp]));const W=600,H=200,b=24,cw=(W-20)/6;
  const bars=data.map((d,i)=>{const x=20+i*cw+cw*.18,bw=cw*.3;const hi=(d.inc/max)*(H-b-10),he=(d.exp/max)*(H-b-10);
    return`<rect x="${x}" y="${H-b-hi}" width="${bw}" height="${hi}" rx="3" fill="var(--inc)"><title>${d.m} 收入 ${money(d.inc)}</title></rect>
    <rect x="${x+bw+3}" y="${H-b-he}" width="${bw}" height="${he}" rx="3" fill="var(--exp)"><title>${d.m} 支出 ${money(d.exp)}</title></rect>
    <text x="${x+bw}" y="${H-6}" text-anchor="middle">${+d.m.slice(5)}月</text>`}).join('');
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:220px"><line x1="16" x2="${W}" y1="${H-b}" y2="${H-b}" stroke="var(--line)"/>${bars}</svg>
  <div class="row muted" style="font-size:13px"><span><span class="dot" style="display:inline-block;width:10px;height:10px;background:var(--inc);border-radius:3px"></span> 收入</span><span><span style="display:inline-block;width:10px;height:10px;background:var(--exp);border-radius:3px"></span> 支出</span></div>`;
}
function hbars(items,fmt=money){
  const max=Math.max(1,...items.map(x=>x.v));
  return items.length?`<div class="grid" style="gap:10px">${items.map(x=>`<div><div class="row" style="font-size:13px"><span>${esc(x.k)}</span><span class="sp"></span><b>${fmt(x.v)}</b>${x.extra||''}</div><div class="bar"><i style="width:${Math.min(100,x.v/(x.max||max)*100)}%;background:${x.color||'var(--accent)'}"></i></div></div>`).join('')}</div>`:`<div class="empty">尚無資料</div>`;
}

/* ---------- 財務分析與建議 ---------- */
function analyze(ym){
  const A=[];const T=totals();const l=monthTx(ym);
  const inc=sumType(l,'income'),exp=sumType(l,'expense');
  const avgInc=avgMonthly('income',ym),avgExp=avgMonthly('expense',ym);
  const add=(lv,title,msg)=>A.push({lv,title,msg});
  // 儲蓄率
  if(inc>0){const sr=(inc-exp)/inc;
    if(sr>=.3)add('good','儲蓄率優秀',`本月儲蓄率 ${pct(sr)}，高於 30%。可考慮把多出的現金定期定額投入 ETF，讓資金長期增值。`);
    else if(sr>=.2)add('good','儲蓄率健康',`本月儲蓄率 ${pct(sr)}，達到建議的 20% 以上。持續保持「先存再花」。`);
    else if(sr>=0)add('warn','儲蓄率偏低',`本月儲蓄率 ${pct(sr)}，建議至少 20%。可以發薪日自動轉帳 ${money(inc*.2)} 到儲蓄帳戶。`);
    else add('bad','本月入不敷出',`支出超過收入 ${money(exp-inc)}。請檢視下方分類，優先刪減非必要支出。`);
  }else if(l.length===0)add('warn','本月尚無紀錄','記帳是理財的第一步，建議每天睡前花 2 分鐘記錄當日支出。');
  // 緊急預備金
  if(avgExp>0){const m=T.liquid/avgExp;
    if(m>=6)add('good','緊急預備金充足',`活錢約可支應 ${m.toFixed(1)} 個月生活費（建議 6 個月）。${m>12?'超過 12 個月的部分可考慮投資以對抗通膨。':''}`);
    else if(m>=3)add('warn','緊急預備金待加強',`活錢可支應 ${m.toFixed(1)} 個月，建議目標 6 個月（約 ${money(avgExp*6)}），還差 ${money(avgExp*6-T.liquid)}。`);
    else add('bad','緊急預備金不足',`活錢僅能支應 ${m.toFixed(1)} 個月，有家庭與小孩建議優先存到 6 個月（${money(avgExp*6)}）再加碼投資。`);
  }
  // 負債比
  if(avgInc>0&&T.loanPmt>0){const d=T.loanPmt/avgInc;
    if(d<=.3)add('good','房貸/負債負擔合理',`每月貸款 ${money(T.loanPmt)}，占收入 ${pct(d)}（建議 ≤ 1/3）。`);
    else if(d<=.4)add('warn','負債負擔偏重',`每月貸款占收入 ${pct(d)}，接近上限。避免再增加新貸款，可評估轉貸降息。`);
    else add('bad','負債負擔過重',`每月貸款占收入 ${pct(d)}，超過 40%。建議優先償還高利率貸款（如信貸），或與銀行協商延長年限。`);
  }
  const hi=S.loans.filter(x=>+x.rate>=5&&loanCalc(x).rem>0);
  if(hi.length)add('warn','有高利率貸款',`${hi.map(x=>x.name).join('、')} 利率 ≥ 5%，提前償還等同於獲得無風險報酬，優先處理。`);
  // 信用卡
  const due=S.cards.filter(c=>!c.paid&&+c.bill>0&&cardDueInfo(c).days<=7);
  if(due.length)add('bad','信用卡即將到期',due.map(c=>`${c.name} ${money(+c.bill)}（${cardDueInfo(c).days} 天後）`).join('、')+'，請務必全額繳清，循環利息可高達 15%。');
  const billTot=S.cards.reduce((s,c)=>s+(+c.bill||0),0);
  if(avgInc>0&&billTot/avgInc>.5)add('warn','卡費占收入比例高',`本期卡費合計 ${money(billTot)}，占月收入 ${pct(billTot/avgInc)}。刷卡容易無感消費，建議設定每張卡的月上限。`);
  // 保險
  const annInc=avgInc*12;
  if(annInc>0&&T.premium>0){const p=T.premium/annInc;
    if(p>.15)add('warn','保費負擔偏高',`年保費 ${money(T.premium)}，占年收入 ${pct(p)}（雙十原則建議約 10%）。檢視是否有儲蓄險占比過高。`);
    else add('good','保費比例合理',`年保費占年收入 ${pct(p)}，符合 10% 左右的原則。`);
  }
  const earners=S.members.filter(m=>m.role==='本人'||m.role==='配偶');
  earners.forEach(m=>{
    const life=S.insurance.filter(i=>i.memberId===m.id&&(i.kind==='壽險'||i.kind==='意外')).reduce((s,i)=>s+(+i.coverage||0),0);
    const mInc=S.txns.filter(t=>t.memberId===m.id&&t.type==='income'&&t.category==='薪資').reduce((s,t)=>s+twd(t),0);
    const monthsWith=new Set(S.txns.filter(t=>t.memberId===m.id&&t.category==='薪資').map(t=>ymOf(t.date))).size||1;
    const yInc=mInc/monthsWith*12;
    const memberLoan=S.loans.filter(x=>x.memberId===m.id).reduce((s,x)=>s+loanCalc(x).rem,0);
    const need=yInc*10+memberLoan;
    if(yInc>0&&life<need*.6)add('warn',`${m.name} 的壽險/意外保障可能不足`,`建議保額約為年收入 10 倍＋本人負債（約 ${money(need)}），目前 ${money(life)}。可用便宜的定期壽險補足。`);
  });
  S.members.filter(m=>m.role==='子女').forEach(m=>{
    const has=S.insurance.some(i=>i.memberId===m.id&&['醫療','意外'].includes(i.kind));
    if(!has)add('warn',`${m.name} 尚無醫療/意外險紀錄`,'小孩建議以實支實付醫療險＋意外險為主，保費低、保障實用。');
  });
  // 投資
  if(T.stock>0){
    const top=[...S.stocks].sort((a,b)=>stockMV(b)-stockMV(a))[0];const w=stockMV(top)/T.stock;
    if(w>.4&&S.stocks.length>1)add('warn','持股過度集中',`${top.symbol} ${top.name} 占股票部位 ${pct(w)}，單一個股超過 40% 風險較高，可搭配市值型 ETF 分散。`);
    const ratio=T.stock/Math.max(1,T.assets);
    add('good','投資部位',`股票市值 ${money(T.stock)}，占總資產 ${pct(ratio)}；預估年股利 ${money(S.stocks.reduce((s,x)=>s+(+x.shares||0)*(+x.dps||0)*rate(x.currency),0))}。`);
  }else if(avgInc>0&&T.liquid>avgExp*6)add('warn','現金閒置',`預備金已足夠但沒有投資紀錄，可考慮每月定期定額投入市值型 ETF。`);
  // 分類異常 & 預算
  const prevAvg={};for(let i=1;i<=3;i++)monthTx(shiftYm(ym,-i)).filter(t=>t.type==='expense').forEach(t=>prevAvg[t.category]=(prevAvg[t.category]||0)+twd(t)/3);
  const cur={};l.filter(t=>t.type==='expense').forEach(t=>cur[t.category]=(cur[t.category]||0)+twd(t));
  Object.entries(cur).forEach(([k,v])=>{if(prevAvg[k]>2000&&v>prevAvg[k]*1.3&&v-prevAvg[k]>2000)add('warn',`「${k}」支出暴增`,`本月 ${money(v)}，比前 3 個月平均 ${money(prevAvg[k])} 多了 ${pct(v/prevAvg[k]-1)}。`)});
  Object.entries(S.budgets).forEach(([k,b])=>{if(b>0&&(cur[k]||0)>b)add('bad',`「${k}」超出預算`,`預算 ${money(b)}，已花 ${money(cur[k])}，超支 ${money(cur[k]-b)}。`)});
  const want=['娛樂','服飾','旅遊'].reduce((s,k)=>s+(cur[k]||0),0);
  if(inc>0&&want/inc>.3)add('warn','享樂型支出偏高',`娛樂、服飾、旅遊共 ${money(want)}，占收入 ${pct(want/inc)}。可參考 50/30/20 法則：必要 50%、想要 30%、儲蓄 20%。`);
  // 外幣
  if(T.fxCash>0&&T.cash>0)add(T.fxCash/T.cash>.5?'warn':'good','外幣部位',`外幣存款折合 ${money(T.fxCash)}，占存款 ${pct(T.fxCash/T.cash)}${T.fxCash/T.cash>.5?'，比例偏高，要留意匯率波動，生活預備金建議以台幣為主':''}。匯率請定期到「設定」更新。`);
  // 備份提醒
  const lb=S.meta.lastBackup;const bd=lb?Math.floor((Date.now()-new Date(lb))/864e5):null;
  if(S.txns.length&&(bd===null||bd>30))add('warn','該備份資料了',bd===null?'還沒有匯出過備份。資料只存在這個瀏覽器，請到「設定」匯出備份。':`距離上次備份已 ${bd} 天，建議每月匯出一次。`);
  // 淨資產
  if(T.net<0)add('bad','家庭淨資產為負','負債大於資產，建議先停止新增負債並建立還款計畫。');
  const order={bad:0,warn:1,good:2};return A.sort((a,b)=>order[a.lv]-order[b.lv]);
}

const UNDO_KEY=KEY+'.beforeImport',UNDO_MAX=5;
function undoList(){
  try{const v=JSON.parse(localStorage.getItem(UNDO_KEY)||'null');if(!v)return[];
    return Array.isArray(v)?v:[{label:'匯入前',at:'',data:v}]}catch(e){return[]}   // 舊版只存一份

function undoSave(list){
  while(true){try{list.length?localStorage.setItem(UNDO_KEY,JSON.stringify(list)):localStorage.removeItem(UNDO_KEY);return true}
    catch(e){if(list.length<=1)return false;list.shift()}}   // 空間不夠就丟掉最舊的
}
function snapshot(label){
  const list=undoList();list.push({label:label||'匯入前',at:new Date().toISOString(),data:JSON.parse(JSON.stringify(S))});
  while(list.length>UNDO_MAX)list.shift();undoSave(list);updUndoBtn();
}
function hasUndo(){return undoList().length>0}
const undoWhen=at=>at?new Date(at).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
function undoLast(idx){
  const list=undoList();if(!list.length)return alert('沒有可以復原的動作');
  const i=idx??list.length-1;const u=list[i];const steps=list.length-i;
  if(!confirm(`復原「${u.label}」${undoWhen(u.at)?`（${undoWhen(u.at)}）`:''}？\n\n資料會回到這個動作之前的樣子${steps>1?`，之後的 ${steps-1} 個動作也會一起取消`:''}。`))return;
  try{S=migrate(u.data);undoSave(list.slice(0,i));save();hideUndoBar();render();updUndoBtn();alert('已復原：'+u.label)}catch(e){alert('復原失敗：'+e.message)}
}

const SKIP_RE=/本期應繳|最低應繳|上期|前期|繳款|已繳|感謝|合計|小計|總計|應繳總額|結帳日|截止日|循環信用|信用額度|可用額度|紅利|回饋點數/;
const CUR_RE=/\s+(?:USD|JPY|EUR|GBP|HKD|CNY|RMB|KRW|SGD|AUD|THB|MYR|VND|TWD|NTD|NT\$|TW|TWN|US|USA|JP|JPN|GB|HK|SG|KR|CN|IE|NL|CA|AU|TH|LU)$/i;
const DATE_HEAD=/^\s*(?:(\d{2,4})[\/\-年.])?(\d{1,2})[\/\-月.](\d{1,2})日?(?![\d,])/;
const pad2=n=>String(n).padStart(2,'0');
function toISO(y,m,d){
  m=+m;d=+d;if(m<1||m>12||d<1||d>31)return null;
  const now=new Date();let yy;
  if(y){yy=+y;if(yy<1000)yy+=1911;if(yy<1990||yy>now.getFullYear()+1)return null}
  else{yy=now.getFullYear();if(m>now.getMonth()+1)yy--}
  return`${yy}-${pad2(m)}-${pad2(d)}`;
}
function parseStatement(text){
  const rows=[];let total=null;
  const tm=text.replace(/\s+/g,'').match(/本期(?:應繳|帳單)(?:總)?(?:金)?額[^\d\-]{0,12}(-?[\d,]+)/);
  if(tm)total=+tm[1].replace(/,/g,'');
  for(let line of text.split(/\r?\n/)){
    if(/,"|",|^[^\s,]+,[^\s,]+,/.test(line))line=csvLine(line);
    line=line.replace(/[　\t]/g,'  ').replace(/[＄$]/g,'').trim();
    const m=line.match(DATE_HEAD);if(!m)continue;
    const date=toISO(m[1],m[2],m[3]);if(!date)continue;
    let rest=line.slice(m[0].length),m2;
    while((m2=rest.match(DATE_HEAD)))rest=rest.slice(m2[0].length);   // 跳過入帳日
    rest=rest.trim();
    let amtStr,desc;
    const am=rest.match(/(-?)\s*(\d[\d,]*(?:\.\d+)?)\s*(-?)\s*元?$/);
    if(am){amtStr=am;desc=rest.slice(0,am.index)}
    else{ // 金額不在最後一欄（常見於 CSV）
      const all=[...rest.matchAll(/(?:^|\s)(-?)(\d[\d,]*(?:\.\d+)?)(-?)(?=\s|$)/g)];if(!all.length)continue;
      amtStr=all[all.length-1];desc=rest.slice(0,amtStr.index);
    }
    let amt=+amtStr[2].replace(/,/g,'');if(!amt)continue;if(amtStr[1]||amtStr[3])amt=-amt;
    desc=desc.trim();
    for(let i=0;i<4;i++)desc=desc.replace(CUR_RE,'').replace(/\s+-?\d[\d,]*(?:\.\d+)?$/,'').replace(/\s+\d{1,2}\/\d{1,2}$/,'').trim();
    desc=desc.replace(/\s{2,}/g,' ');
    if(!desc||SKIP_RE.test(desc))continue;
    rows.push({date,desc,amt});
  }
  return{rows,total};
}

  for(;;){
    try{doc=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0)),password,cMapUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',cMapPacked:true}).promise;break}
    catch(e){
      if(e.name!=='PasswordException')throw e;
      password=prompt(e.code===2?'密碼錯誤，請重新輸入 PDF 密碼：':'這份帳單有密碼保護，請輸入開啟密碼（通常是身分證字號或生日）：');
      if(password==null)throw new Error('已取消');
    }
  }
  const lines=[];
  for(let p=1;p<=doc.numPages;p++){
    const tc=await(await doc.getPage(p)).getTextContent();const rows=[];
    for(const it of tc.items){
      if(!it.str||!it.str.trim())continue;
      const x=it.transform[4],y=it.transform[5];
      let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,items:[]};rows.push(r)}
      r.items.push({x,s:it.str,w:it.width});
    }
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){
      r.items.sort((a,b)=>a.x-b.x);let s='',end=null;
      for(const it of r.items){if(end!==null&&it.x-end>3)s+='  ';s+=it.s;end=it.x+it.w}
      lines.push(s);
    }
  }
  return lines.join('\n');
}

const TESS='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/';

let ocrWorker=null;
async function ocrPrep(f){   // 放大小截圖、縮小超大照片，辨識比較準
  let bmp;try{bmp=await createImageBitmap(f)}catch(e){throw new Error('無法開啟這張圖片（iPhone 的 HEIC 請改用截圖或在「照片」選擇「最相容」格式）')}
  const W=bmp.width,H=bmp.height,k=W<1600?Math.min(2.5,2000/W):W>3500?3500/W:1;
  const c=document.createElement('canvas');c.width=Math.round(W*k);c.height=Math.round(H*k);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.filter='grayscale(1) contrast(1.25)';g.drawImage(bmp,0,0,c.width,c.height);
  return c;
}
function ocrClean(t){
  const fw=s=>s.replace(/[！-～]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/　/g,' ');
  return fw(t).split(/\r?\n/).map(l=>{
    l=l.replace(/[“”"‘’`]+/g,' ').replace(/(^|\s)[|_~—]+(?=\s|$)/g,'$1');   // 表格線、雜點被認成的符號    l=l.replace(/([㐀-鿿])[ ](?=[㐀-鿿])/g,'$1');            // 「全 聯 福 利」→「全聯福利」
    l=l.replace(/(\d)\s*([,.])\s*(\d{3})(?!\d)/g,'$1$2$3').replace(/(\d)\s+\/\s*(\d)/g,'$1/$2').replace(/(\d)\/\s+(\d)/g,'$1/$2');   // 「1, 234」「10 / 05」
    l=l.split(/(\s+)/).map(w=>/\d/.test(w)&&/^[\dOoIl|,.\-\/]+$/.test(w)&&(w.match(/\d/g)||[]).length>=w.length/2?w.replace(/[Oo]/g,'0').replace(/[Il|]/g,'1'):w).join('');
    return l.replace(/\s+$/,'');
  }).filter(l=>l.trim()).join('\n');
}
async function ocrImages(files,say){
  if(!window.Tesseract){say('⏳ 載入文字辨識元件…');await loadScript(TESS+'tesseract.min.js')}
  if(!ocrWorker){say('⏳ 第一次使用要下載中文辨識資料（約 10–20MB），請稍候，之後會留在手機／電腦裡…');
    ocrWorker=await Tesseract.createWorker(['chi_tra','eng'],1,{logger:m=>{if(m.status&&/load|initializ/.test(m.status)&&m.progress)say(`⏳ 準備文字辨識：${Math.round(m.progress*100)}%`)}});
    await ocrWorker.setParameters({preserve_interword_spaces:'1',tessedit_pageseg_mode:'6'});
  }
  const out=[];
  for(let i=0;i<files.length;i++){
    say(`⏳ 辨識第 ${i+1}／${files.length} 張圖片…（約 5–20 秒）`);
    const {data}=await ocrWorker.recognize(await ocrPrep(files[i]));out.push(ocrClean(data.text||''));
  }
  return out.join('\n');
}

// 編碼自動判斷：UTF-16（CWMoney 匯出常見）、UTF-8、Big5
function decodeText(buf){
  const b=new Uint8Array(buf);
  if(b[0]===0xFF&&b[1]===0xFE)return new TextDecoder('utf-16le').decode(buf);
  if(b[0]===0xFE&&b[1]===0xFF)return new TextDecoder('utf-16be').decode(buf);
  let z=0;const n=Math.min(b.length,400);for(let i=1;i<n;i+=2)if(b[i]===0)z++;
  if(n>20&&z>n/6)return new TextDecoder('utf-16le').decode(buf);
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('big5').decode(buf)}
}
// 可處理引號、欄位內換行；自動判斷逗號／Tab／分號分隔
function parseDelimited(text){
  const head=text.split(/\r?\n/).slice(0,8).join('\n');
  const d=['\t',',',';'].map(c=>[c,head.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===d){row.push(cur);cur=''}
    else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else if(ch!=='\r')cur+=ch;
  }
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c));
}
function parseAnyDate(v){
  const s=String(v??'').trim();if(!s)return null;
  const ok=(y,m,d)=>{if(y<1000)y+=1911;if(y<1980||y>2100||m<1||m>12||d<1||d>31)return null;return`${y}-${pad2(m)}-${pad2(d)}`};
  if(/^\d{5}(\.\d+)?$/.test(s)&&+s>29000&&+s<73000){const d=new Date(Math.round((Math.floor(+s)-25569)*864e5));return ok(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())} // Excel 日期序號
  let m=s.match(/(\d{2,4})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/);if(m)return ok(+m[1],+m[2],+m[3]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return ok(+m[3],+m[1],+m[2]);   // 美式 月/日/年
  m=s.match(/^(\d{4})(\d{2})(\d{2})$/);if(m)return ok(+m[1],+m[2],+m[3]);
  m=s.match(/^(\d{1,2})\s*[\/月]\s*(\d{1,2})日?$/);if(m)return toISO(null,m[1],m[2]);   // 只有月／日（信用卡帳單常見），年份自動推算
  return null;
}
function parseAmt(v){
  if(typeof v==='number')return v;
  let s=String(v??'').replace(/NT\$|NTD|TWD|[＄$元,\s]/gi,'');if(!s)return NaN;
  let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(/^[-+]?\d*\.?\d+-?$/.test(s)){if(s.endsWith('-')){neg=!neg;s=s.slice(0,-1)}const n=parseFloat(s);return neg?-n:n}
  return NaN;
}

function mapCat(main,sub,type){
  const list=type==='income'?INC_CATS:EXP_CATS;
  for(const c of[sub,main])if(c&&list.includes(c))return c;
  for(const c of[sub,main])if(c&&CAT_MAP[c])return CAT_MAP[c];
  for(const c of[sub,main])if(c){const k=Object.keys(CAT_MAP).find(k=>c.includes(k));if(k)return CAT_MAP[k];const l=list.find(x=>c.includes(x));if(l)return l}
  if(type==='expense'&&(sub||main))return guessCat(sub+' '+main)!=='其他'?guessCat(sub+' '+main):(main||sub);
  return main||sub||(type==='income'?'其他收入':'其他');
}
function mapType(v,amt,from,to,cat){
  v=String(v||'').toLowerCase();
  if(/轉帳|轉|transfer/.test(v))return'transfer';
  if(/收入|income|^收$/.test(v))return'income';
  if(/支出|expense|花費|^支$/.test(v))return'expense';
  if(from&&to)return'transfer';
  if(amt<0)return'expense';
  if(INC_CATS.includes(cat)||/薪|獎金|利息|股利|股息|收入/.test(cat))return'income';
  return'expense';
}

function extDetect(forcedHdr){   // forcedHdr：使用者手動指定的標題列（-1 = 沒有標題列）
  const syn=Object.fromEntries(Object.entries(EXT_SYN).map(([k,l])=>[k,l.map(x=>x.toLowerCase().replace(/[\s_]/g,''))]));
  const N=s=>String(s).toLowerCase().replace(/[\s_\-:：()（）]/g,'');
  let best=-1,bs=0;
  EXT.raw.slice(0,15).forEach((r,i)=>{const sc=r.filter(c=>typeof c==='string'&&c.length<20&&Object.values(syn).some(l=>l.some(k=>N(c).includes(k)))).length;if(sc>bs){bs=sc;best=i}});
  EXT.hdr=forcedHdr!==undefined?forcedHdr:bs>=2?best:-1;EXT.map={};
  const hdr=EXT.hdr>=0?EXT.raw[EXT.hdr].map(N):[];const used=new Set();
  for(const f of EXT_ORDER){
    let idx=-1;
    for(const k of syn[f]){idx=hdr.findIndex((h,i)=>!used.has(i)&&h===k);if(idx>=0)break}
    if(idx<0)for(const k of syn[f]){if(k.length<2)continue;idx=hdr.findIndex((h,i)=>!used.has(i)&&h.includes(k));if(idx>=0)break}
    if(idx>=0){used.add(idx);EXT.map[f]=idx}
  }
  if(EXT.map.date==null||EXT.map.amount==null){  // 沒有標題列：依內容猜日期、金額欄
    const sample=EXT.raw.slice(EXT.hdr+1,EXT.hdr+21);const ncol=Math.max(...sample.map(r=>r.length));
    for(let c=0;c<ncol;c++){if(used.has(c))continue;const vals=sample.map(r=>r[c]);
      if(EXT.map.date==null&&vals.filter(v=>parseAnyDate(v)).length>sample.length*.6){EXT.map.date=c;used.add(c);continue}
      if(EXT.map.amount==null&&vals.filter(v=>v!==''&&isFinite(parseAmt(v))&&!/[\/年]/.test(String(v))).length>sample.length*.6){EXT.map.amount=c;used.add(c)}}
  }
  extCompute();
}
function extCompute(){
  const M=EXT.map,g=(r,f)=>M[f]!=null&&M[f]>=0?(r[M[f]]??''):'';
  const out=[];let bad=0;
  for(const r of EXT.raw.slice(EXT.hdr+1)){
    const date=parseAnyDate(g(r,'date'));const amt=parseAmt(g(r,'amount'));
    if(!date||!isFinite(amt)||!amt){bad++;continue}
    let from=String(g(r,'from')).trim(),to=String(g(r,'to')).trim();const main=String(g(r,'category')).trim(),sub=String(g(r,'sub')).trim();
    const type=mapType(g(r,'type'),amt,from,to,main||sub);
    if(type!=='transfer'){from=from||to;to=''}   // 收入常記在「收款／轉入」欄
    const cat=type==='transfer'?'轉帳':EXT.mapCat?mapCat(main,sub,type):(sub||main||'其他');
    let note=String(g(r,'note')).trim();
    const orig=[main,sub].filter(x=>x&&x!==cat).join('/');   // 原分類保留在備註，方便日後查
    if(orig&&type!=='transfer'&&!note.includes(orig))note=note?`${note}（${orig}）`:orig;
    let cur=String(g(r,'currency')).trim().toUpperCase();cur=CURRENCIES.includes(cur)?cur:'TWD';
    const mem=S.members.find(m=>m.name===String(g(r,'member')).trim());
    out.push({date,amt:Math.abs(amt),type,cat,from,to,note,currency:cur,memberId:mem?mem.id:EXT.member});
  }
  out.forEach(x=>x.dup=S.txns.some(t=>t.date===x.date&&Math.abs(+t.amount-x.amt)<0.5&&t.type===x.type&&(t.note||'')===x.note));
  EXT.rows=out;EXT.bad=bad;
  const dups=out.filter(x=>x.dup).length;
  EXT.status=out.length?`✅ 讀到 ${out.length} 筆${bad?`，${bad} 列無法辨識日期或金額已略過`:''}${dups?`，${dups} 筆可能已匯入過`:''}。請確認欄位對應正確再匯入。`
    :'⚠️ 沒有讀到有效資料，請在下方調整「日期」「金額」欄位對應。';
}

const colNorm=s=>String(s).toLowerCase().replace(/[\s_\-:：()（）\/]/g,'');
function detectCols(rows,sch,forced){
  const syn=Object.fromEntries(Object.entries(sch.syn).map(([k,l])=>[k,l.map(colNorm)]));
  let best=-1,bs=0;
  rows.slice(0,25).forEach((r,i)=>{const sc=r.filter(c=>typeof c==='string'&&c.length<20&&Object.values(syn).some(l=>l.some(k=>k.length>1&&colNorm(c).includes(k)))).length;if(sc>bs){bs=sc;best=i}});
  const hdr=forced!==undefined?forced:bs>=2?best:-1;
  const H=hdr>=0?rows[hdr].map(colNorm):[];const used=new Set();const map={};
  for(const f of sch.order){let idx=-1;
    for(const k of syn[f]){idx=H.findIndex((h,i)=>!used.has(i)&&h===k);if(idx>=0)break}

const CREDIT_RE=/存入|存款|薪|利息|股利|股息|配息|轉入|退款|退費|入帳|收入|獎金|匯入/;

const SUMMARY_RE=/小計|合計|總計|本期餘額|期末餘額|本期結餘/;
const TIME_TOK=/^\d{1,2}:\d{2}(:\d{2})?$/;

// 1) 一般存摺明細：每行「日期 … 摘要 … 金額 … 餘額」，用餘額變化判斷是支出還是存入
// 2) 合庫等「電子綜合對帳單」轉帳明細：金額在日期行的上一行（$14,000.00）、手續費在下一行（$0），
//    日期行含交易時間、轉出／轉入帳號與備註；餘額另列在「帳戶總覽」
function parseBankText(text){
  const out=[];const meta={overview:[],baseDate:null,endBal:null};
  let pending=null,awaitFee=null,outflow=false;
  const bd=text.match(/對帳單基準日\s*[：:]\s*(\d{2,4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(bd)meta.baseDate=toISO(bd[1],bd[2],bd[3]);
  for(let line of text.split(/\r?\n/)){
    line=line.replace(/[　\t]/g,'  ').trim();if(!line)continue;
    if(/轉出金額|轉帳交易明細|轉出帳號/.test(line))outflow=true;   // 這區都是轉出的款項
    if(DOLLAR_LINE.test(line)){                     // 單獨一行的「$金額」
      const v=parseAmt(line.replace(/[＄$]/g,''));
      if(awaitFee){awaitFee.fee=v;if(v){awaitFee.amt+=v;awaitFee.desc+=`（含手續費 ${v}）`}awaitFee=null}
      else pending=v;
      continue;
    }
    const m=line.match(DATE_HEAD);
    if(!m){
      if(OPENING_RE.test(line)){const n=line.replace(/[＄$]/g,'').match(/(-?\d[\d,]*(?:\.\d+)?)\s*$/);if(n)out.push({open:true,bal:parseAmt(n[1])})}
      // 帳戶總覽：「存摺存款  5137766***231  112,999.00」
      const t=line.split(/\s{2,}/);
      if(t.length>=3&&ACCT_KIND.test(t[0].replace(/\s/g,''))&&ACCT_TOK.test(t[1])){const b=parseAmt(t[2]);if(isFinite(b))meta.overview.push({kind:t[0],acct:t[1],bal:b})}
      continue;
    }
    const date=toISO(m[1],m[2],m[3]);if(!date)continue;
    let r=line.slice(m[0].length),m2;while((m2=r.match(DATE_HEAD)))r=r.slice(m2[0].length);
    // 同一行裡的「$金額」（有些 PDF 會把金額和日期排在同一行）
    const dollars=outflow?[...r.matchAll(/[＄$]\s*(-?\d[\d,]*(?:\.\d+)?)/g)].map(x=>parseAmt(x[1])):[];
    r=dollars.length?r.replace(/[＄$]\s*-?\d[\d,]*(?:\.\d+)?/g,' '):r.replace(/[＄$]/g,'');

    if(pending!=null||dollars.length){             // 格式 2：金額在 $ 行
      const amt=pending!=null?pending:dollars[0];pending=null;
      if(words.length>1&&GENERIC_SUMMARY.test(words[0]))words=[...words.slice(1),`（${words[0]}）`];
      const row={date,desc:words.join(' ').replace(' （','（'),amt:outflow?-Math.abs(amt):Math.abs(amt),bal:null,unsigned:!outflow&&amt>=0,from:accts[0]||''};
      if(dollars.length>1&&pending==null){row.fee=dollars[1];if(dollars[1])row.amt-=dollars[1]}else awaitFee=row;
      if(row.amt)out.push(row);
      continue;
    }
    awaitFee=null;
    // 格式 1：金額、餘額在行尾
    const nums=[];let rr=words.join('  '),mm;
    while(nums.length<4&&(mm=rr.match(/(?:^|\s)([-+]?\d[\d,]*(?:\.\d+)?-?)\s*$/))){nums.unshift(parseAmt(mm[1]));rr=rr.slice(0,mm.index).trim()}
    const desc=rr.replace(/\s{2,}/g,' ');
    if(!nums.length)continue;
    if(OPENING_RE.test(desc)){out.push({open:true,bal:nums[nums.length-1]});continue}
    if(SUMMARY_RE.test(desc))continue;
    if(nums.length>=2){const cand=nums.slice(0,-1).filter(n=>n);if(!cand.length)continue;
      out.push({date,desc,amt:Math.abs(cand[cand.length-1]),bal:nums[nums.length-1],unsigned:cand[cand.length-1]>=0})}
    else out.push({date,desc,amt:nums[0],bal:null,unsigned:nums[0]>=0});
  }
  // 用「帳戶總覽」找出轉出帳戶在基準日的餘額，供校正使用
  const froms=out.map(x=>x.from).filter(Boolean);
  if(froms.length&&meta.baseDate){
    const cnt={};froms.forEach(f=>cnt[f]=(cnt[f]||0)+1);
    const main=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
    const ov=meta.overview.find(o=>o.acct===main);
    if(ov)meta.endBal={date:meta.baseDate,bal:ov.bal,acct:main};
  }
  out.meta=meta;
  return out;
}
function bankFinalize(list){
  const opens=list.filter(x=>x.open);const tx=list.filter(x=>!x.open);
  if(tx.length>1&&tx[0].date>tx[tx.length-1].date)tx.reverse();   // 新到舊 → 舊到新
  let prev=opens.length?opens[0].bal:null;
  for(const x of tx){
    if(x.unsigned){let s=null;
      if(prev!=null&&x.bal!=null&&Math.abs(Math.abs(x.bal-prev)-Math.abs(x.amt))<0.5)s=Math.sign(x.bal-prev)||1;
      if(s==null)s=CREDIT_RE.test(x.desc)?1:-1;
      x.amt=s*Math.abs(x.amt);x.unsigned=false}
    prev=x.bal!=null?x.bal:prev!=null?prev+x.amt:null;
  }
  return tx.filter(x=>x.amt);
}

// 券商月對帳單（富邦等）文字：讀「交割資料」與「現股買賣明細」
//  交割：115/10/05  115/10/05  應 付  -5,317
//  明細：115/10/06  115/10/08  普 買  聯 電  200  148.5000  29,700  42  0  0  29,742
//       定期定額的「普 買 定 期 定」會印在日期行的上一行；PDF 偶爾把股數和價格黏在一起（3＋2,536.43 → 32,536.4300），用成交金額反推拆開
function parseBrokerText(text){
  const trades=[],settle=[];let sec='',pendSide='',total=null,rebate=null;
  const D='(\\d{2,4}[\\/\\-.]\\d{1,2}[\\/\\-.]\\d{1,2})';
  const iso=s=>{const p=s.split(/[\/\-.]/);return toISO(p[0],p[1],p[2])};
  const cj=s=>s.replace(/([㐀-鿿])[ 　](?=[㐀-鿿])/g,'$1');   // 「第 一 金」→「第一金」
  const isN=t=>/^-?\d[\d,]*(\.\d+)?$/.test(t);
  const near=(a,b)=>Math.abs(a-b)<=Math.max(1.5,Math.abs(b)*0.002);
  const sideOf=t=>/賣/.test(t)?'sell':/買/.test(t)?'buy':'';
  for(const raw of text.split(/\r?\n/)){
    const line=cj(raw.replace(/\t/g,'  ').trim());if(!line)continue;
    const flat=line.replace(/\s/g,'');
    if(/單位[:：]/.test(flat))sec=/現股/.test(flat)&&!/融資|融券|當沖|借貸/.test(flat)?'trade':/人民幣|美元|港幣|日圓/.test(flat)?'other':sec==='trade'?'other':sec;
    if(/^應收\(\+\)\/付\(-\)金額-?[\d,]+$/.test(flat)){total=parseAmt(flat.replace(/^.*額/,''));continue}
    if(/折讓手續費/.test(flat)){const n=flat.match(/(-?[\d,]+)$/);if(n)rebate=parseAmt(n[1]);continue}
    const st=line.match(new RegExp('^'+D+'\\s+'+D+'\\s+(應收|應付)\\s+(-?[\\d,]+(?:\\.\\d+)?)$'));
    if(st){const amt=parseAmt(st[4]);const a=st[3]==='應付'?-Math.abs(amt):Math.abs(amt);
      const tdate=iso(st[1]),sdate=iso(st[2]);if(tdate&&sdate&&a)settle.push({tdate,sdate,amt:a});continue}
    if(sec!=='trade')continue;
    if(/本期合計|^合計/.test(flat)){sec='other';continue}
    const m=line.match(new RegExp('^'+D+'\\s+'+D+'\\s+(.*)$'));
    if(!m){if(flat.length<=10&&/買|賣/.test(flat))pendSide=sideOf(flat);continue}   // 「普 買 定 期 定」
    const tdate=iso(m[1]),sdate=iso(m[2]);if(!tdate)continue;
    let toks=m[3].split(/\s+/),side='',name='';const nums=[];
    for(const t of toks){if(isN(t))nums.push(t);else if(!side&&t.length<=6&&/買|賣/.test(t)&&!name)side=sideOf(t);else if(!name)name=t}
    side=side||pendSide;pendSide='';
    const v=nums.map(parseAmt);
    let i=v.findIndex((x,k)=>k>0&&k+1<v.length&&v[k-1]>0&&x>0&&near(v[k-1]*x,v[k+1]));
    if(i<0){   // 股數和價格黏在一起
      for(let k=0;k+1<nums.length&&i<0;k++){const t=nums[k];
        for(let c=1;c<t.length;c++){const L=t.slice(0,c),R=t.slice(c);
          if(!/^\d[\d,]*\d$|^\d$/.test(L)||/^[,.]/.test(R))continue;
          if(near(parseAmt(L)*parseAmt(R),v[k+1])){v.splice(k,1,parseAmt(L),parseAmt(R));i=k+1;break}}}
    }
    if(i<0||!side||!name)continue;
    const shares=v[i-1],price=v[i],amount=v[i+1],fee=v[i+2]||0;
    const tail=v.slice(i+2);   // 手續費、交易稅…、客戶應收、客戶應付
    let net=side==='buy'?tail[tail.length-1]:tail[tail.length-2];
    let tax=side==='sell'&&v[i+3]!=null&&tail.length>=4?v[i+3]:0;
    if(!(net>0))net=side==='buy'?amount+fee:amount-fee-tax;
    if(side==='sell'&&!near(amount-fee-tax,net))tax=Math.max(0,amount-fee-net);
    trades.push({date:tdate,sdate,name,side,shares,price,amount,fee,tax,net});
  }
  return{trades,settle,total,rebate};
}

function stmCompute(){
  const M=STM.map,has=f=>M[f]!=null&&M[f]!==-1,g=(r,f)=>cellAt(r,M[f]);
  const body=STM.raw?STM.raw.slice(STM.hdr+1):[];let rows=[],bad=0;
  const lotCol=f=>STM.hdr>=0&&M[f]>=0&&/張/.test(String(STM.raw[STM.hdr][M[f]]));  // 單位是「張」→ ×1000
  const num=v=>parseAmt(String(v??'').replace(/[＄$]/g,''));
  if(STM.mode==='bank'||STM.mode==='card'){
    const isCard=STM.mode==='card';let list;
    if(STM.src==='text')list=((isCard?STM.parsedCard:STM.parsed)||[]).map(x=>({...x}));
    else{list=[];for(const r of body){
      const date=parseAnyDate(g(r,'date'));if(!date)continue;   // 沒有日期的行（標題、說明文字）直接略過
      // 說明：有指定就用；沒指定就取其餘非數字、非帳號、非時間的文字
      let desc=[g(r,'note'),g(r,'memo')].map(x=>String(x).trim()).filter(Boolean).join(' ');
      if(!has('note')&&!has('memo')){
        const used=new Set(Object.keys(M).filter(has).map(f=>{const v=M[f];return v>=0?v:r.length+v+1}));
        desc=r.filter((c,i)=>!used.has(i)&&c!==''&&!parseAnyDate(c)&&!TIME_TOK.test(c)&&!ACCT_TOK.test(c)&&!isFinite(num(c))).join(' ');
      }
      if(OPENING_RE.test(desc)){const b=num(g(r,'balance'));if(isFinite(b))list.push({open:true,bal:b});continue}
      if(SUMMARY_RE.test(desc))continue;
      const d=num(g(r,'debit')),c=num(g(r,'credit')),a=num(g(r,'amount')),b=num(g(r,'balance'));
      let amt,uns=false;

      const dup=S.txns.some(t=>t.type==='transfer'&&t.date===s.sdate&&Math.abs(+t.amount-Math.abs(s.amt))<0.5&&(t.accountId==='stock'||t.toAccountId==='stock'));

    :`⚠️ 沒有辨識到資料。${STM.raw?'請在「欄位對應」調整欄位；':''}也可以把明細複製後貼到文字框再試。`;

function stmCommit(){
  const sel=STM.rows.filter(r=>r.on&&(r.amt!==0||(STM.mode!=='bank'&&STM.mode!=='card')));
  const selSettle=STM.mode==='trade'&&STM.settle?STM.settle.filter(s=>s.on):[];
  if(!sel.length&&!selSettle.length)return alert('沒有勾選任何資料');
  if(STM.mode==='trade'){
    const miss=sel.filter(r=>!stockCode(r.code));if(miss.length)return alert('請先填入這些股票的代號：\n'+miss.map(r=>r.name).join('、'));
    if(selSettle.length&&!STM.settleId&&!sel.length)return alert('請先選擇「交割帳戶」，交割款才知道要記在哪個帳戶');
  }
  if(STM.mode==='bank'&&!STM.accountId)return alert('請先選擇要匯入到哪個帳戶');
  if(STM.mode==='card'&&!S.cards.some(c=>c.id===STM.cardId))return alert('請先選擇要匯入到哪張信用卡');
  const target=STM.mode==='bank'?S.accounts.find(a=>a.id===STM.accountId)?.name:STM.mode==='card'?S.cards.find(c=>c.id===STM.cardId)?.name:memberName(STM.memberId);
  const label=`${{bank:'匯入銀行對帳單',card:'匯入信用卡帳單',hold:'更新證券庫存',trade:'匯入證券交易'}[STM.mode]} ${sel.length||selSettle.length} 筆到「${target||''}」`;
  snapshot(label);let msg='';
  if(STM.mode==='card'){
    const card=S.cards.find(c=>c.id===STM.cardId);let n=0;
    for(const r of sel){if(r.kind==='skip')continue;
      S.txns.push({id:uid(),date:r.date,type:'expense',amount:+(-r.amt).toFixed(2),currency:'TWD',category:r.cat||'其他',memberId:card.memberId||'',accountId:'',cardId:card.id,note:r.desc,toAccountId:'',toAmount:'',fee:''});n++}
    msg=`已匯入 ${n} 筆到「${card.name}」，合計 ${money(sel.filter(r=>r.kind!=='skip').reduce((s,r)=>s-r.amt,0))}`;
    curYm=ymOf(sel[sel.length-1].date);tab='cards';
  }else if(STM.mode==='bank'){
    const acct=S.accounts.find(a=>a.id===STM.accountId);const cur=acct.currency||'TWD';let n=0;
    for(const r of sel){
      if(r.kind==='skip')continue;
      const base={id:uid(),date:r.date,amount:Math.abs(r.amt),currency:cur,memberId:acct.memberId||'',note:r.desc,cardId:'',toAmount:'',fee:''};
      if(r.kind==='expense'||r.kind==='income')S.txns.push({...base,type:r.kind,category:r.cat||(r.kind==='income'?'其他收入':'其他'),accountId:acct.id,toAccountId:''});
      else{const x=r.kind.slice(3);
        if(r.amt<0){S.txns.push({...base,type:'transfer',category:'轉帳',accountId:acct.id,toAccountId:x});
          const c=x.startsWith('card:')&&S.cards.find(c=>'card:'+c.id===x);
          if(c&&Math.abs(r.amt)*rate(cur)>=(+c.bill||0)-1)c.paid=true}
        else{const xc=acctCur(x);S.txns.push({...base,type:'transfer',category:'轉帳',accountId:x,toAccountId:acct.id,currency:xc,amount:conv(Math.abs(r.amt),cur,xc),toAmount:Math.abs(r.amt)})}}
      n++;
    }
    msg=`已匯入 ${n} 筆到「${acct.name}」`;
    const last=(STM.meta&&STM.meta.endBal)||[...sel].reverse().find(r=>r.bal!=null);   // 綜合對帳單：用帳戶總覽餘額
    if(STM.fixOpening&&last){const diff=last.bal-accountBalance(acct,last.date);
      if(Math.abs(diff)>=0.5){acct.opening=(+acct.opening||0)+diff;msg+=`\n已依對帳單 ${last.date} 餘額 ${fmtCur(last.bal,cur)} 校正期初餘額（調整 ${fmtCur(diff,cur)}）`}}
    curYm=ymOf(sel[sel.length-1].date);tab='txns';
  }else if(STM.mode==='hold'){
    const codes=new Set(sel.map(r=>r.code));let add=0,upd=0,del=0;
    if(STM.replace){const before=S.stocks.length;S.stocks=S.stocks.filter(s=>!(s.memberId===STM.memberId&&(s.currency||'TWD')===STM.currency&&!codes.has(s.symbol)));del=before-S.stocks.length}
    for(const r of sel){
      const ex=S.stocks.find(s=>s.symbol===r.code&&s.memberId===STM.memberId);
      if(ex){ex.shares=+r.shares;if(r.cost!=='')ex.cost=+r.cost;if(r.price!=='')ex.price=+r.price;if(!ex.name)ex.name=r.name;upd++}
      else{S.stocks.push({id:uid(),memberId:STM.memberId,symbol:r.code,name:r.name,currency:STM.currency,shares:+r.shares,cost:+(r.cost||r.price||0),price:+(r.price||r.cost||0),dps:''});add++}
    }
    msg=`持股已更新：新增 ${add} 檔、更新 ${upd} 檔${del?`、移除 ${del} 檔`:''}`;tab='stocks';
  }else{
    let pl=0,n=0;S.meta.trades=S.meta.trades||[];
    for(const r of sel){
      let h=S.stocks.find(s=>s.symbol===r.code&&s.memberId===STM.memberId);
      if(r.side==='buy'){
        if(!h){h={id:uid(),memberId:STM.memberId,symbol:r.code,name:r.name,currency:STM.currency,shares:0,cost:0,price:r.price,dps:''};S.stocks.push(h)}
        const ns=(+h.shares||0)+r.shares;h.cost=+(((+h.shares||0)*(+h.cost||0)+r.shares*r.price+r.fee)/ns).toFixed(4);h.shares=ns;
      }else if(h){
        const q=Math.min(r.shares,+h.shares||0);const gain=r.price*r.shares-r.fee-r.tax-(+h.cost||0)*r.shares;pl+=gain;
        h.shares=(+h.shares||0)-q;
        if(STM.recordPL&&gain)S.txns.push({id:uid(),date:r.date,type:gain>0?'income':'expense',amount:Math.abs(+gain.toFixed(2)),currency:STM.currency,category:gain>0?'投資收益':'投資損失',memberId:STM.memberId,accountId:'',cardId:'',note:`賣出 ${r.code} ${r.name} 已實現${gain>0?'獲利':'虧損'}`});
        if(h.shares<=0)S.stocks=S.stocks.filter(s=>s!==h);
      }
      if(r.price>0&&h&&S.stocks.includes(h))h.price=r.price;
      if(r.name&&STM.broker){S.meta.stockNames=S.meta.stockNames||{};S.meta.stockNames[nameKey(r.name)]=r.code}
      if(STM.settleId&&!STM.settle){   // 沒有交割資料時，逐筆依成交記交割款
        const amt=r.net??(r.side==='buy'?r.shares*r.price+r.fee:r.shares*r.price-r.fee-r.tax);
        S.txns.push({id:uid(),date:r.date,type:'transfer',category:'轉帳',amount:+amt.toFixed(2),currency:STM.currency,memberId:STM.memberId,cardId:'',toAmount:'',fee:'',
          accountId:r.side==='buy'?STM.settleId:'stock',toAccountId:r.side==='buy'?'stock':STM.settleId,note:`${r.side==='buy'?'買進':'賣出'} ${r.code} ${r.name} ${r.shares}股`});
      }
      S.meta.trades.push([r.date,r.code,r.side,r.shares,r.price].join('|'));n++;
    }
    let sn=0,ss=0;
    if(STM.settleId)for(const s of selSettle){   // 交割資料：依交割日記「銀行 ⇄ 股票」轉帳
      S.txns.push({id:uid(),date:s.sdate,type:'transfer',category:'轉帳',amount:Math.abs(s.amt),currency:STM.currency,memberId:STM.memberId,cardId:'',toAmount:'',fee:'',
        accountId:s.amt<0?STM.settleId:'stock',toAccountId:s.amt<0?'stock':STM.settleId,note:s.desc});sn++;ss+=s.amt}
    msg=(n?`已套用 ${n} 筆交易到持股`:'')+(sn?`${n?'\n':''}已記錄 ${sn} 筆交割款（淨額 ${money(ss)}）到「${S.accounts.find(a=>a.id===STM.settleId)?.name||''}」`:'')+`${pl?`\n賣出已實現損益：${money(pl*rate(STM.currency))}${STM.recordPL?'（已記入收支）':''}`:''}`;tab='stocks';
  }
  save();document.getElementById('stm').close();render();alert(msg);showUndoBar(label);
}

/* ---------- 自動更新 ----------
   開啟 App、切回 App、以及每小時，向網站抓最新的 index.html 比對版本號；有新版就在畫面下方提示。 */
const UPD={latest:null,checked:false,busy:false};
function cmpVer(a,b){const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0}
async function checkUpdate(manual){
  if(!PWA.http||UPD.busy)return;UPD.busy=true;
  const msg=t=>{const el=document.getElementById('updMsg');if(el)el.textContent=t};
  if(manual)msg('檢查中…');
  try{
    const html=await(await fetch('./index.html?v='+Date.now(),{cache:'no-store'})).text();
    const v=(html.match(/APP_VERSION='([^']+)'/)||[])[1];
    UPD.checked=true;UPD.latest=v||null;
    if(v&&cmpVer(v,APP_VERSION)>0){showUpdBar(v);msg(`有新版本 v${v}`)}
    else if(manual)msg('已是最新版本 v'+APP_VERSION);
  }catch(e){if(manual)msg('無法連線，請稍後再試')}
  UPD.busy=false;
}
function showUpdBar(v){
  const b=document.getElementById('updBar');
  b.innerHTML=`<span style="flex:1">🎉 有新版本 <b>v${esc(v)}</b>（目前 v${APP_VERSION}）</span><button class="btn" onclick="applyUpdate()">立即更新</button><button class="btn ghost" onclick="document.getElementById('updBar').classList.remove('show')">稍後</button>`;
  b.classList.add('show');
}
async function applyUpdate(){
  const b=document.getElementById('updBar');b.innerHTML='<span>⏳ 更新中…</span>';
  try{const reg=await navigator.serviceWorker?.getRegistration();if(reg)await reg.update()}catch(e){}
  location.reload();
}
if(PWA.http){
  setTimeout(()=>checkUpdate(false),1500);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate(false)});
  setInterval(()=>{if(document.visibilityState==='visible')checkUpdate(false)},3600e3);
}
async function installApp(){
  if(PWA.prompt){PWA.prompt.prompt();const r=await PWA.prompt.userChoice;if(r.outcome==='accepted'){PWA.prompt=null;document.getElementById('installBtn').style.display='none'}return}
  alert(PWA.ios?'iPhone／iPad：請用 Safari 開啟本頁 → 點下方「分享」按鈕 → 選「加入主畫面」。'
    :'請在 Chrome 右上角「⋮」選單中選「安裝應用程式」或「加到主畫面」。');
}
function pwaCard(){
  const how=!PWA.http?`<p class="neg" style="margin-top:0">目前是直接開啟檔案，無法安裝成 App，手機也無法這樣執行。請把 App 資料夾放到 https 網址（例如 GitHub Pages），再用手機開啟該網址。</p>`
    :PWA.standalone?`<p class="pos" style="margin-top:0">✅ 目前已經以 App 模式執行。</p>`
    :`<p style="margin-top:0">把記帳本加到手機主畫面，像一般 App 一樣全螢幕開啟，沒有網路也能記帳。</p>
      <div class="row"><button class="btn" onclick="installApp()">📲 安裝成手機 App</button></div>
      <p class="muted" style="font-size:13px">Android（Chrome）：按上面按鈕，或「⋮」選單 →「安裝應用程式／加到主畫面」。<br>iPhone（Safari）：「分享」按鈕 →「加入主畫面」。</p>`;
  return`<div class="card"><h3>📱 手機 App</h3>${how}
    <p class="muted" style="font-size:13px;margin-bottom:0">資料存在各自裝置的 App 裡，手機和電腦的資料不會自動同步；要搬移或合併請用「匯出備份 → 匯入備份」。${PWA.persisted===true?'<br>✅ 已開啟持久保存，資料較不會被系統自動清除。':''}</p></div>`;
}
function fmtCard(){
  const list=S.meta.stmProfiles||[];const nm={bank:'銀行',card:'信用卡',hold:'證券庫存',trade:'證券交易'};
  return`<div class="card"><h3>📐 已儲存的對帳單格式</h3>
    <p class="muted" style="margin-top:0;font-size:13px">匯入對帳單讀錯時，可在匯入畫面的「欄位對應」自行指定欄位，再按「儲存格式」。之後同一家的對帳單會自動套用。格式會一起存進備份檔。</p>
    ${list.length?`<div class="grid" style="gap:6px">${list.map(p=>`<div class="row"><span class="tag">${nm[p.mode]||p.mode}</span><b>${esc(p.name)}</b><span class="muted" style="font-size:13px">辨識文字：${esc(p.keyword)}</span><span class="sp"></span><button class="btn ghost mini" onclick="stmDelProfile('${p.id}')">刪除</button></div>`).join('')}</div>`
      :'<div class="muted" style="font-size:13px">尚未儲存任何格式。</div>'}</div>`;
}
// 主畫面捷徑「記一筆」：?action=add
if(new URLSearchParams(location.search).get('action')==='add')setTimeout(()=>openForm('txns'),0);

render();
</script>
